    - Coal India Limited

# Names that look like a universe member and are not. Matching one of these means
# the article is about a different company, so the article must NOT be linked -
# and saying so explicitly is stronger than hoping the alias list stays exclusive.
confusable:
  - Tata Motors          # not in the universe; shares a prefix with TATASTEEL and TCS
  - Tata Power
  - Tata Chemicals
  - Tata Elxsi
  - Bajaj Finserv        # a separate listing from BAJFINANCE
  - Bajaj Auto
  - Bajaj Holdings
  - HDFC Life
  - HDFC AMC
  - ICICI Prudential
  - ICICI Lombard
  - SBI Life
  - SBI Cards
  - Adani Ports
  - Adani Green
  - Adani Power
  - Adani Transmission
  - Kotak Mahindra Prime
  - JSW Energy
  - JSW Infrastructure
  - Mahindra Logistics
  - Mahindra Holidays
  - Tech Mahindra        # distinct from M&M
  - Reliance Power       # unrelated to RELIANCE
  - Reliance Infrastructure
