# How a company is named in prose, mapped to its exchange symbol.
#
# **Substring matching is forbidden here, and this file is why.** "Tata Motors"
# contains "Tata", which also starts "Tata Steel" and "Tata Consultancy". "HDFC"
# is a prefix of "HDFC Bank" but they were different listed companies. "Bajaj
# Finance" and "Bajaj Finserv" differ by four characters and move on different
# news. A substring match links a story to the wrong instrument, and a thesis on
# the wrong instrument is worse than no thesis - it looks researched.
#
# Matching is whole-phrase against a normalised form (lowercased, punctuation
# stripped, runs of whitespace collapsed), longest alias first so that
# "Bajaj Finserv" is tested before "Bajaj".
#
# A bare surname or group name is NEVER an alias. "Tata", "Bajaj", "Adani" and
# "Mahindra" are deliberately absent: they are ambiguous between listed entities
# and resolving them would be guessing.

version: 1
effective_from: 2026-10-18
source: "hand-written from company legal names; extend as misses are found"

aliases:
  RELIANCE:
    - Reliance Industries
    - Reliance Industries Limited
    - RIL
  HDFCBANK:
    - HDFC Bank
    - HDFC Bank Limited
  ICICIBANK:
    - ICICI Bank
    - ICICI Bank Limited
