# RSS feeds we read.
#
# **No commercial news publisher is on this list, and that is deliberate.**
#
# Sixteen feeds were surveyed on 2026-10-18 and every Indian financial publisher
# whose terms could be read prohibits automated aggregation - see `excluded`
# below, each with the clause quoted. robots.txt permitted several of those
# paths and several served an honestly-identified client; neither is a licence.
# The terms of use are the binding document.
#
# The standing rule (ISS-014): **a source is used when its terms clearly allow
# it, not when they merely fail to forbid it.** Unread terms are not permission.
#
# What is left is primary regulatory disclosure, which stands on different
# ground: a SEBI order is a legally-mandated public dissemination, not a
# publisher's copyrighted reporting.
#
# **NSE was removed on 2026-10-20 (ISS-041).** The reasoning above - that a
# mandated disclosure is not copyrighted reporting - is about the *content*. It
# says nothing about the *manner of access*, and NSE's Terms of Use prohibit
# "any systematic or automated data collection activities" outright. Reading
# the content's status as permission to automate collecting it was the mistake;
# the clause is quoted under `excluded`.
#
# Nothing here may be added without reading that source's terms and recording
# the finding, quoted, in this file.

version: 4
effective_from: 2026-10-20

user_agent: "trading-desk/0.1 (personal research bot; +https://github.com/akumar760496/AgenticAIAutomatedTrading)"
min_interval_seconds: 5

feeds:
  - name: SEBI
    url: https://www.sebi.gov.in/sebirss.xml
    tier: EXCHANGE
    tier_reason: >-
      The securities regulator publishing its own orders, circulars and
      adjudications. Primary fact with the same standing as an exchange filing,
      not reporting about one - which is why it sits at EXCHANGE rather than
      TIER_1. Content is enforcement actions, appeals and policy, so it informs
      risk and eligibility rather than sentiment.
    # "16 Oct, 2026 +0530" - a date, an offset, no time of day. The standard
    # RFC 822 parser raises on it and silently dropped all 30 items.
    date_format: date_only
    checked: 2026-10-18
    terms: https://www.sebi.gov.in/website-policy.html
    robots: https://www.sebi.gov.in/robots.txt
    compliance: >-
      robots.txt is "User-agent: * / Disallow:" with only /js and /css excluded,
      which permits automated access to this path explicitly. The Terms of Use
      section imposes no restriction on access or automated use - it is a
      liability disclaimer. The Linking Policy states "We do not object to you
      linking directly to the information that is hosted on this Website and no
      prior permission is required for the same." Framing is prohibited; this
      adapter does not frame, and never fetches the linked page.
    limit: >-
      The Copyright Policy says material "may be reproduced free of charge after
      taking proper permission by sending a mail to us", and that where material
      "is being published or issued to others, the source must be prominently
      acknowledged". Private research storage is not reproduction or
      publication, so the current use is within the policy. **If a briefing
      built on this is ever shared beyond the operator, emailed permission and
      prominent attribution to SEBI become required first.**

excluded:
  - name: National Stock Exchange of India (corporate announcements and filing documents)
    url: https://www.nseindia.com/api/corporate-announcements
    checked: 2026-10-20
    terms: https://www.nseindia.com/nse-terms-of-use
    robots: https://www.nseindia.com/robots.txt
    reason: >-
      Live, reachable and the single most useful source in the project - it
      produced all 1,946 filings in the archive, and 100% of them carry a
      document URL. Excluded anyway, and the clause is not ambiguous. NSE's
      Terms of Use: "User is granted a non-exclusive, non-transferable, limited
      right to access the Website / Mobile Application and avail the services
      provided by NSE through the Website / Mobile Application. User is
      prohibited to conduct any systematic or automated data collection
      activities (including scraping, data mining, data extraction and data
      harvesting) on or in relation to our Website / Mobile Application." There
      is no personal-use exception. The separate copyright page does permit a
      user to "view, print copies and download the Content for personal,
      non-commercial or educational purpose" - that is a person acting by hand,
      and it does not license automating the same act. On storage the Terms add
      that Content "shall not be ... stored (either in hardcopy or in an
      electronic retrieval system) ... without prior written permission of NSE".
      robots.txt is "User-agent: * / Allow: /" with only /market-data-test
      disallowed, which under the ISS-014 standard is not a licence - the same
      reasoning that excluded RBI despite a permissive robots.txt.
    unblock: >-
      Three routes, cheapest first. (1) Free, not a purchase: written permission
      from NSE, which the clause names explicitly - nsewebmaster@nse.co.in is
      the contact given on their hyperlinking policy. (2) A licensed vendor:
      Dhan is already a paid, licensed data source and may expose corporate
      announcements; this would need checking and would be a purchase decision.
      (3) Accept the risk in writing as an owner decision, the way ISS-013 was
      accepted. Until one of those, neither the announcements poller nor the
      document fetcher may run.
    vendor_check_2026_10_20: >-
      Route (2) was investigated. **Global Financial Datafeeds LLP appears as
      entry 7 on NSE's own "AUTHORISED REALTIME DATA VENDORS" list**
      (nsearchives.nseindia.com/web/sites/default/files/inline-files/Authorized_Realtime_Data_Vendors.pdf),
      ticked for CM, F&O, CD and Index. That is verification from the exchange
      rather than the vendor's own claim, which is the check that was never done
      for direct NSE access. **But the list is titled "realtime data" and its
      columns are market-data segments - it does not mention corporate
      announcements or fundamental data**, which is the data this project needs.
      Their Fundamental Data API is a separate product and its licence basis is
      unconfirmed. Two things must be asked in writing before any purchase:
      (a) under what licence the corporate/fundamental data API is supplied, and
      (b) whether the NSE authorisation covers it.
      Their Terms & Conditions are better than NSE's for our use - storage is
      restricted only against disclosure ("or store it in a manner likely to
      allow it to be disclosed to third parties") rather than prohibited
      outright - but carry a catch that matters here: on termination "you will
      undertake to delete and destroy all licensed materials, copies thereof".
      For a project whose core asset is an unrepeatable IV time series, ending
      the subscription would mean deleting the series. They also push exchange
      compliance back to the subscriber: "it is their duty & responsibility to
      consult each Source Stock Exchange to know their rules, regulations".
  - name: Reserve Bank of India (press releases and notifications)
    url: https://www.rbi.org.in/pressreleases_rss.xml
    checked: 2026-10-18
    terms: https://www.rbi.org.in/Scripts/Disclaimer.aspx
    reason: >-
      Both feeds are live, fresh and answer an honest User-Agent (press
      releases 10 items, notifications 10 items, newest 16 Oct 2026), and the
      content would be genuinely useful. Excluded anyway: RBI's Terms &
      Conditions of Use state "Except as set forth below, caching and links to,
      and the framing of this Web Site or any of the contents are prohibited."
      The only carve-outs are a link to the Home Page "upon notifying RBI in
      writing", and a link to an internal page for which "the user must make a
      specific request for, and secure permission from RBI prior to
      hyper-linking". Storing feed items is caching, and every item is a deep
      link to an internal page. That is prohibited conduct on a plain reading,
      not merely unaddressed. robots.txt could not be read either - it returns
      an "Unauthorised Access" page to an honest client.
    unblock: >-
      Free, not a purchase: a written request to RBI for permission to cache
      and deep-link the RSS feeds. If granted, move this entry into `feeds`
      with tier EXCHANGE and date_format rfc822_naive_ist - the feed stamps
      "Fri, 16 Oct 2026 18:30:00" with no offset, and the times are IST.

  - name: Economic Times Markets
    url: https://economictimes.indiatimes.com/markets/stocks/rssfeeds/2146842.cms
    checked: 2026-10-18
    terms: https://economictimes.indiatimes.com/terms-conditions
    reason: >-
      Terms of use carry an explicit "AI and Text/Data Mining Restriction"
      prohibiting, without a separate written licence, any use of site content
      for "(d) any other automated or technology-enabled summarization or
      aggregation in order to generate real-time answers, outputs or derivative
      content", and stating the restriction "applies regardless of whether such
      access is automated ... or manual". The clause also names caching
      explicitly. An automated daily briefing is exactly the described use. The
      only carve-out is search-engine indexing, which this is not.

  - name: Mint Markets
    url: https://www.livemint.com/rss/markets
    checked: 2026-10-18
    terms: https://www.hindustantimes.com/terms-of-use
    reason: >-
      HT Media terms prohibit using "any 'deep-link', 'page-scrape', 'robot',
      'spider' or other automatic device, program, algorithm or methodology ...
      to access, acquire, copy or monitor any portion of the Platform/Website or
      any content or information". That clause carries no personal-use
      exception. A scheduled poller is an automatic device.

  - name: Moneycontrol Business
    url: https://www.moneycontrol.com/rss/business.xml
    checked: 2026-10-18
    reason: >-
      Abandoned feed - answers HTTP 200 with valid XML whose newest item is
      dated 23 April 2024. Dropped on quality grounds before the terms question
      arose; its terms were never assessed.

  - name: Business Standard Markets
    url: https://www.business-standard.com/rss/markets-106.rss
    checked: 2026-10-18
    reason: >-
      Returns 403 to an honestly identified client while serving a spoofed
      browser User-Agent. Reading it would mean disguising the client to get
      past a refusal, which is not something this project does.

  # --- surveyed 2026-10-18, terms read, all rejected ---

  - name: Times of India Business
    url: https://timesofindia.indiatimes.com/rssfeeds/1898055.cms
    checked: 2026-10-18
    terms: https://www.indiatimes.com/termsandcondition
    reason: >-
      Times Internet, the same company as Economic Times, and the identical "AI
      and Text/Data Mining Restriction" applies. Also separately prohibits any
      "robot, spider, scraper, or other automated or manual means to access the
      Website or copy any Content". Feed itself is live and fresh.

  - name: CNBC TV18 Market
    url: https://www.cnbctv18.com/commonfeeds/v1/cne/rss/market.xml
    checked: 2026-10-18
    terms: https://www.cnbctv18.com/termsofuse/
    reason: >-
      Network18 terms prohibit use "for any purpose, including creating large
      language models and/or training of A.I. tools, unless separately and
      specifically authorized in writing", and separately prohibit "scrape,
      crawl, mine or extract data from the site ... without express written
      permission". Feed is live with 200 items and very fresh - and unusable.

  - name: The Hindu BusinessLine
    url: https://www.thehindubusinessline.com/markets/feeder/default.rss
    checked: 2026-10-18
    terms: https://www.thehindugroup.com/termsofuse.html
    reason: >-
      No explicit AI clause found, but THG terms restrict content to "personal
      and non-commercial usage" and prohibit "modifying, copying, distributing"
      it. Not clearly permitted for automated aggregation, and the standard
      since ISS-014 is that a source is used only when the terms clearly allow
      it - not merely when they fail to clearly forbid it. Live, 60 items, fresh.

  - name: NDTV Profit
    url: https://feeds.feedburner.com/ndtvprofit-latest
    checked: 2026-10-18
    reason: >-
      Live, 20 items, fresh. No terms-of-use link found on ndtvprofit.com and
      ndtv.com/term-of-use returns 403, so the terms could not be read. Unread
      terms are not permission.

  - name: Financial Express / Business Today / Zee Business / PIB / Reuters
    checked: 2026-10-18
    reason: >-
      Rejected on availability before terms were reached. Financial Express and
      Business Today returned HTTP 200 with zero parseable items; Zee Business
      404; PIB 403; the Reuters feedburner endpoint is dead.

# ---------------------------------------------------------------------------
# Drishti (Manasija) news API - IN USE from 2026-10-20, on the owner's decision.
#
# Read by adapters/news/drishti.py. The key is DRISHTI_API_KEY in .env.
#
# **Everything from this source is TIER_2 by default, and that is deliberate.**
# Drishti returns its own summary of a publisher's article, never the article.
# An AI-written precis of an Economic Times report is not an Economic Times
# report, so the tier reflects the weakest link in the chain rather than the
# newspaper's standing. Promoting any publisher to TIER_1 is a sign-off
# decision, not a config tweak - it directly loosens Setup A's credibility gate.
#
# Nothing here is ever EXCHANGE tier. Exchange filings are a separate Drishti
# product and are deliberately not wired; that needs its own port and its own
# DEVLOG entry.
#
# ISS-043 is still open: their Customer Agreement s1.3 allows content to be
# "aggregated from public sources", and whether any of it is collected from the
# exchange websites is unanswered. Treat stored rows as a droppable cache.
# ---------------------------------------------------------------------------
drishti:
  base_url: https://developers.manasija.in/v1
  # Sandbox plan is 10 requests/minute. 6.5s keeps us under it with room to spare.
  min_interval_seconds: 6.5
  # 6 pages x 50 rows is 300 articles per symbol batch, comfortably more than
  # 30 days of news for 20 names (measured: 486 rows for all 24 over 30 days).
  max_pages_per_batch: 6
  default_publisher_tier: TIER_2
  # Left empty on purpose. The four publishers actually seen in the feed are
  # Economic Times, Money Control, Live Mint and Business Standard; promoting
  # any of them needs the sign-off described above.
  publisher_tiers: {}
  measured_2026_10_20: >-
    Probed against our own 24-name universe over 30 days before being wired:
    486 unique rows, all 24 names covered, 31 distinct days, freshest item 28
    minutes old. (An earlier run of the same probe reported 299 symbol-tagged
    rows; it split the `symbol` field on commas alone and so dropped every
    multi-company row. See `_symbols_of` - the real separator is a colon.) Sources were
    Economic Times 165, Money Control 124, Live Mint 114, Business Standard 83.
    long_summary ran 301-1,756 characters, median 1,095.
    Two limits that bound what may be claimed from it: the archive starts
    mid-2025 (2022, 2023 and 2024 return zero rows, so catalyst gates can be
    backtested over ~12 months, not the 4 years of bars we hold), and sentiment
    is skewed 282 positive / 153 neutral / 51 negative, which is close to a
    constant and must be measured against outcomes before being trusted.
    Credit cost, measured: news ~1 per page, announcements 1 per row,
    detailed=true 2 per row.

# ---------------------------------------------------------------------------
# Candidate vendors - evaluated, NOT in use. Nothing here may be wired up
# until its open question is answered in writing (CLAUDE.md rule 11).
# ---------------------------------------------------------------------------
candidates:
  - name: Drishti (Manasija Technologies Private Limited, Mangalore)
    url: https://drishti.manasija.in
    checked: 2026-10-20
    terms:
      - https://drishti.manasija.in/customer-agreement
      - https://drishti.manasija.in/legal/terms-and-conditions
      - https://drishti.manasija.in/legal/privacy-policy
    offers: >-
      Corporate announcements with source PDF citations, company and market news
      with sentiment, earnings filings with financial fields, conference-call
      transcripts, block deals, symbol metadata. REST plus a WebSocket stream
      and an MCP server. This is almost exactly the shape of the gap ISS-041
      left behind.
    price: >-
      Starter Rs 2,000/month (10,000 credits, 100 symbols, 60 rpm);
      Pro Rs 10,000/month (50,000 credits, 1,000 symbols). Sandbox is 1,000
      free credits once. A PURCHASE - needs the owner's say-so in advance.
    terms_are_good_for_us: >-
      Unusually clear, and better than every other source checked so far.
      Customer Agreement s4.7: "Absent a specified limit, Customer may retain
      Drishti Content as needed for its licensed use." s4.12: "Persistent
      storage of streamed Drishti Content is permitted to the extent reasonably
      necessary for Customer's licensed use." s3.4 permits use "for internal
      business intelligence, research, analytics, monitoring" - which is this
      project, exactly. s1.6: "Customer owns Customer Derivatives", defined as
      "analyses, insights, reports, visualizations, applications, features,
      scores, and signals you create using Drishti Content" - so our gate
      outputs, labels and scores are ours. They also give an IP indemnity:
      "Drishti will defend Customer against third-party claims alleging that
      the Service, used as authorized, infringes".
    the_catch: >-
      On termination, s1.17: "Customer must, upon termination or expiration,
      delete raw or substantially-raw Drishti Content", cached and exported
      copies included - the same trap found in GFDL's terms. But s16 adds "you
      may keep Customer Derivatives and content lawfully displayed to End
      Users". That is a DESIGN CONSTRAINT, not a blocker: store derived
      features (catalyst class, sentiment, scores, our own labels) in our own
      tables and treat raw announcement text as a cache we can lose. Done that
      way, cancelling the subscription costs nothing irreplaceable. Doing it
      the other way round repeats the ISS-041 deletion.
    open_question: >-
      **Where does the data actually come from?** Their FAQ says "empanelled"
      vendors, which would mean a licensed chain, but names none, and the site
      makes NO claim of NSE or BSE authorised-vendor status - they are absent
      from NSE's own authorised realtime data vendors list, where GFDL appears
      as entry 7. Worse, their own Customer Agreement s1.3 defines Drishti
      Content as arising "whether originated by Drishti, licensed from third
      parties, **aggregated from public sources**, or generated by Drishti
      systems". "Aggregated from public sources" is the phrase that would
      describe scraping NSE - the precise thing ISS-041 says we may not do, and
      buying it secondhand does not obviously launder it. Their s1.10 also
      warns Third-Party Materials "may carry supplier restrictions" without
      saying which. Ask in writing, before paying:
      (a) which empanelled vendors supply the announcements and news, and does
          that chain hold current NSE/BSE agreements;
      (b) is any part of it collected directly from the exchange websites;
      (c) does the indemnity in s14 cover a claim by an exchange or a news
          publisher about the upstream collection.
      Note their own blog states the right standard unprompted - that a
      successful API response is not a licence, and entitlements should be
      confirmed in writing. So asking is in keeping with how they write.
    do_not_use_sandbox_for_real_queries: >-
      Privacy Policy s4: on the Sandbox/Free plan, queries, requests, uploads
      and OUTPUTS "may be retained indefinitely" and used for model training.
      On paid plans they are "**not** used to train our models or third-party
      models" and are kept up to 30 days. Our queries reveal the universe and
      the strategy, so the free tier is for shape-checking the JSON only.
    status: >-
      IN USE for news from 2026-10-20, on the owner's decision, via the
      `drishti:` block above and adapters/news/drishti.py. The entry is kept
      here because the open question (a)/(b)/(c) is **still unanswered** - it
      is the evaluation record, not a to-do. Announcements, earnings and
      concalls remain unwired.
      Verified live on the sandbox plan: SEBI (30 EXCHANGE rows) and Drishti
      (139 TIER_2 rows) read together in one pass over 7 days, 22 of 24 names
      covered.

# What is in use, and why each stands on different ground:
#
#   SEBI RSS - above, with its terms quoted and its one limit recorded.
#
#   That is the entire list. NSE corporate announcements were removed on
#   2026-10-20 (ISS-041): their Terms of Use prohibit "any systematic or
#   automated data collection activities", the adapter is deleted and the 1,946
#   stored filings with it. Setup A's catalyst input is now SEBI's RSS alone -
#   27 articles where there were 1,946 filings - so the catalyst gates are
#   nearly inputless, and closing that gap is what the candidates block above
#   is for.
#
# News *journalism* remains unavailable to us at any price short of a licensed
# API. That is a purchase decision and is recorded as ISS-010.
