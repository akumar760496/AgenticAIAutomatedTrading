[project]
name = "trading-desk"
version = "0.1.0"
description = "Agentic market-research and trading system for Indian equities and options"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Added per build step as they are needed.
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    # Step 0.5: database and transport.
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.1",
    # Step 1.1: Dhan HTTP client and the Parquet chain archive.
    "httpx>=0.27",
    "polars>=1.12",
    "pyyaml>=6.0",
    # Step 1.1c: scheduling the snapshotter.
    "apscheduler>=3.10,<4",
    # Step 1.5b: an explicit CA bundle. httpx 0.28 verifies against the system
    # OpenSSL store, which on macOS lacks the root SEBI's certificate chains to;
    # every request failed TLS and the error was swallowed as an empty feed.
    "certifi>=2024.8.30",
    # Step 3.1: the LLM adapter. Structured output uses a forced tool call, so
    # the SDK is doing schema enforcement rather than the prompt asking nicely.
    "anthropic>=0.40",
]

[project.scripts]
trading-desk = "trading_desk.interfaces.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_desk"]

# ---------------------------------------------------------------------------
# ruff - linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming conventions
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DTZ",       # naive datetime - CLAUDE.md rule 5
    "T20",       # no print() in library code
    "SIM",       # simplify
    "RET",       # return style
    "ARG",       # unused arguments
    "PTH",       # use pathlib
    "ERA",       # commented-out code
    "PL",        # pylint subset
    "RUF",
]
ignore = [
    "PLR0913",   # many arguments: gate functions take explicit values on purpose
    "E501",      # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts, magic numbers and long names.
"tests/**" = ["PLR2004", "S101", "ARG001"]
# Verify scripts print by design - that is their entire output contract.
"scripts/**" = ["T20"]
# The CLI is the one place in src/ that talks to a terminal. Library code still
# may not print: it takes an announce callback or uses the logger.
"src/trading_desk/interfaces/cli.py" = ["T20"]
# A fake or stub must match the signature it stands in for, even where it ignores
# an argument. Dropping the parameter would stop it satisfying the port.
"tests/fakes/**" = ["ARG002"]
"tests/adapters/**" = ["ARG002", "ARG005"]

[tool.ruff.lint.flake8-bugbear]
# Pydantic field definitions legitimately call functions in defaults.
extend-immutable-calls = ["pydantic.Field"]

# ---------------------------------------------------------------------------
# mypy - strict, no exceptions
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_explicit = false   # allowed at adapter boundaries only (docs/14 section 3)
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# Third-party packages without type stubs. Added only when a real import needs it.
module = ["apscheduler.*", "vollib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs a live external service (skipped by default in CI)",
]

[tool.coverage.run]
source = ["src/trading_desk"]
branch = true

[tool.coverage.report]
# domain/ is the code that decides things. It gets held to a higher bar than adapters.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[dependency-groups]
dev = [
    "py-vollib>=1.0.12",
]
