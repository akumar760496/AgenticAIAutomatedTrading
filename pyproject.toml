[project]
name = "trading-desk"
version = "0.1.0"
description = "Agentic market-research and trading system for Indian equities and options"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Added per build step as they are needed. Phase 0 needs almost nothing:
    # a settings loader (step 0.3) and typed models (step 0.4).
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_desk"]

# ---------------------------------------------------------------------------
# ruff - linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming conventions
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DTZ",       # naive datetime - CLAUDE.md rule 5
    "T20",       # no print() in library code
    "SIM",       # simplify
    "RET",       # return style
    "ARG",       # unused arguments
    "PTH",       # use pathlib
    "ERA",       # commented-out code
    "PL",        # pylint subset
    "RUF",
]
ignore = [
    "PLR0913",   # many arguments: gate functions take explicit values on purpose
    "E501",      # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts, magic numbers and long names.
"tests/**" = ["PLR2004", "S101", "ARG001"]
# Verify scripts print by design - that is their entire output contract.
"scripts/**" = ["T20"]

[tool.ruff.lint.flake8-bugbear]
# Pydantic field definitions legitimately call functions in defaults.
extend-immutable-calls = ["pydantic.Field"]

# ---------------------------------------------------------------------------
# mypy - strict, no exceptions
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_explicit = false   # allowed at adapter boundaries only (docs/14 section 3)
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# Third-party packages without type stubs. Added only when a real import needs it.
module = []
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs a live external service (skipped by default in CI)",
]

[tool.coverage.run]
source = ["src/trading_desk"]
branch = true

[tool.coverage.report]
# domain/ is the code that decides things. It gets held to a higher bar than adapters.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
